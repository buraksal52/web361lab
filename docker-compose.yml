services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: web361lab
      POSTGRES_USER: web361lab
      POSTGRES_PASSWORD: web361lab
    ports:
      - "5432:5432"
    volumes:
      - web361lab-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U web361lab -d web361lab"]
      interval: 2s
      timeout: 5s
      retries: 15

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://web361lab:web361lab@database:5432/web361lab
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: >-
      sh -c "alembic upgrade head && python seed.py &&
      uvicorn main:app --host 0.0.0.0 --port 8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "5173:5173"
    command: npm run dev -- --host 0.0.0.0 --mode docker

volumes:
  web361lab-postgres:
